<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>womble</title>
    <meta name="description" content="A series of The Campaign Trail tools, snippets, and other cool utilities">
    <meta name="author" content="StrawberryMaster">
    <meta name="theme-color" content="#590505">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://strawberrymaster.github.io/womble/">
    <meta property="og:title" content="womble">
    <meta property="og:description" content="A series of The Campaign Trail tools, snippets, and other cool utilities">
    <meta property="og:image" content="https://opapeldetrouxa.neocities.org/files/pierce.webp">
    <meta property="og:site_name" content="womble">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="womble">
    <meta name="twitter:description" content="A series of The Campaign Trail tools, snippets, and other cool utilities">
    <meta name="twitter:image" content="https://opapeldetrouxa.neocities.org/files/pierce.webp">

    <link rel="icon" type="image/x-icon" href="https://strawberrymaster.github.io/files/wizardry.ico">
    <link rel="stylesheet" href="./styles.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js" defer></script>
    <script src="./app.js" defer></script>
</head>
<body>
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <div class="container">
        <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
            <h3>Search</h3>
            <input type="text" id="sidebar-search" class="search-box" placeholder="Search... (/)" aria-label="Search documentation">

            <h3>Navigation</h3>
            <ul id="toc-list"></ul>

            <h3>Themes</h3>
            <div class="theme-list" role="group" aria-label="Theme selector">
                <button class="theme-button" data-theme="classic" aria-pressed="true">Classic</button>
                <button class="theme-button" data-theme="dark" aria-pressed="false">Dark</button>
                <button class="theme-button" data-theme="metro" aria-pressed="false">Metro</button>
                <button class="theme-button" data-theme="plain" aria-pressed="false">Plain</button>
                <button class="theme-button" data-theme="scaruffi" aria-pressed="false">Scaruffi</button>
            </div>
        </aside>

        <main class="content">
            <button class="toc-toggle" id="toc-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sidebar">☰ Menu</button>
            <div class="main" id="content"></div>
        </main>
    </div>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <div id="womble-modal-overlay" class="womble-modal-overlay" aria-hidden="true">
        <div class="womble-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="womble-modal-header">
                <h3 id="modal-title" class="womble-modal-title">Code snippet</h3>
                <div class="womble-modal-actions">
                    <a id="modal-raw-btn" class="womble-modal-btn" target="_blank" rel="noopener">Open raw</a>
                    <button id="modal-copy-btn" class="womble-modal-btn">Copy code</button>
                    <button id="modal-close-btn" class="womble-modal-close" aria-label="Close modal">&times;</button>
                </div>
            </div>
            <div class="womble-modal-body">
                <pre><code id="modal-code-content" class="language-javascript"></code></pre>
            </div>
        </div>
    </div>
</body>
</html>
